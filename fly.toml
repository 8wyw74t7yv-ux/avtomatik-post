app = "music-dj-bot-uz-2026"
primary_region = "fra" # Frankfurt (O'zbekistonga eng yaqin va tezkor server)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
